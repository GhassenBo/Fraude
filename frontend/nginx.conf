# Redirect all HTTP to HTTPS (non-www)
server {
    listen 80;
    server_name frauddetect.fr www.frauddetect.fr;
    return 301 https://frauddetect.fr$request_uri;
}

# Redirect HTTPS www → HTTPS non-www
server {
    listen 443 ssl;
    server_name www.frauddetect.fr;

    ssl_certificate     /etc/letsencrypt/live/frauddetect.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frauddetect.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://frauddetect.fr$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name frauddetect.fr;

    ssl_certificate     /etc/letsencrypt/live/frauddetect.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frauddetect.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /usr/share/nginx/html;
    index index.html;

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to Spring Boot
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
